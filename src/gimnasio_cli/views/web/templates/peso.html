{% extends "base.html" %}
{% block contenido %}
  <h2>Peso corporal</h2>
  {% if peso %}
    <p>Última semana registrada — {{ peso.semana }}: <strong>{{ peso.peso_kg }} kg</strong> (cargado el {{ peso.fecha_registro }})</p>
  {% else %}
    <p>Sin registros todavía.</p>
  {% endif %}

  <h3>Registrar / editar peso</h3>
  <form method="post" action="{{ url_for('registrar_peso') }}">
    <label>
      Peso (kg)
      <input type="number" step="0.1" min="0.1" name="peso_kg" required>
    </label>
    <label>
      Semana a editar (opcional, formato AAAA-Www, ej. 2026-W30)
      <input type="text" name="semana" placeholder="Semana actual si se deja vacío">
    </label>
    <button type="submit">Guardar</button>
  </form>
{% endblock %}
