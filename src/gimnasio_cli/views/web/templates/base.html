<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gimnasio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('inicio') }}">Gimnasio</a></h1>
    <nav>
      <a href="{{ url_for('inicio') }}">Semana</a>
      <a href="{{ url_for('ver_peso') }}">Peso</a>
    </nav>
  </header>

  {% with mensajes = get_flashed_messages() %}
    {% if mensajes %}
      <ul class="errores">
        {% for mensaje in mensajes %}
          <li>{{ mensaje }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
